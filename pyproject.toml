[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kiwi-bridge"
version = "0.1.0"
description = "Telegram channel watcher -> channel script -> Bale channel publisher"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27.0,<1",
  "python-dotenv>=1.0.1,<2",
  "telethon>=1.43.0,<2",
  "watchfiles>=0.22.0,<1",
  "python-socks[asyncio]>=2.4.4,<3",
  "redis>=5.0.0,<7",
  "pymysql>=1.1.1,<2",
  "cryptography>=42.0.0,<47",
  "websockets>=12.0,<16",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0,<9",
  "pytest-asyncio>=0.23.0,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
