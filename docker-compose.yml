services:
  kiwi:
    build:
      context: .
      network: host
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        ALL_PROXY: ${ALL_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
        http_proxy: ${http_proxy:-}
        https_proxy: ${https_proxy:-}
        all_proxy: ${all_proxy:-}
        no_proxy: ${no_proxy:-}
    image: ${DOCKER_IMAGE_TAG:-kiwi-bridge:latest}
    restart: unless-stopped
    network_mode: host
    env_file:
      - .env
    volumes:
      - ./config:/app/config:ro
      - ./scripts:/app/scripts
      - ./app_data:/app/app_data
