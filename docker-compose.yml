services:
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    ports:
      - "6380:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-kiwiKIWI}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-kiwi_sync}
      MYSQL_USER: ${MYSQL_USER:-kiwi_admin}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-kiwiKIWI}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-kiwiKIWI}"]
      interval: 10s
      timeout: 5s
      retries: 20

  phpmyadmin:
    image: phpmyadmin:5.2-apache
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: ${MYSQL_USER:-kiwi_admin}
      PMA_PASSWORD: ${MYSQL_PASSWORD:-kiwiKIWI}
      UPLOAD_LIMIT: 256M
    ports:
      - "8081:80"

  kiwi:
    build:
      context: .
      network: host
      args:
        HTTP_PROXY: ${BUILD_HTTP_PROXY:-}
        HTTPS_PROXY: ${BUILD_HTTPS_PROXY:-}
        ALL_PROXY: ${BUILD_ALL_PROXY:-}
        NO_PROXY: ${BUILD_NO_PROXY:-}
        http_proxy: ${build_http_proxy:-}
        https_proxy: ${build_https_proxy:-}
        all_proxy: ${build_all_proxy:-}
        no_proxy: ${build_no_proxy:-}
    image: ${DOCKER_IMAGE_TAG:-kiwi-bridge:latest}
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    restart: unless-stopped
    network_mode: host
    depends_on:
      redis:
        condition: service_started
      mysql:
        condition: service_healthy
      gemini_server:
        condition: service_healthy
    env_file:
      - .env
    environment:
      GUARD_AI_ENDPOINT: http://127.0.0.1:8000/proxy/gemini
      CHANNEL_SCRIPT_AI_ENABLED: ${CHANNEL_SCRIPT_AI_ENABLED:-true}
      CHANNEL_SCRIPT_AI_ENDPOINT: ${CHANNEL_SCRIPT_AI_ENDPOINT:-http://127.0.0.1:8000/proxy/gemini}
      CHANNEL_SCRIPT_AI_MODEL: ${CHANNEL_SCRIPT_AI_MODEL:-gemini-2.5-flash}
      CHANNEL_SCRIPT_AI_TIMEOUT_SEC: ${CHANNEL_SCRIPT_AI_TIMEOUT_SEC:-20}
      CHANNEL_SCRIPT_AI_RETRY_COUNT: ${CHANNEL_SCRIPT_AI_RETRY_COUNT:-1}
      CHANNEL_SCRIPT_AI_TOTAL_BUDGET_SEC: ${CHANNEL_SCRIPT_AI_TOTAL_BUDGET_SEC:-75}
      CHANNEL_SCRIPT_AI_FAIL_OPEN: ${CHANNEL_SCRIPT_AI_FAIL_OPEN:-false}
      CHANNEL_SCRIPT_AI_MAX_IMAGES: ${CHANNEL_SCRIPT_AI_MAX_IMAGES:-3}
      CHANNEL_SCRIPT_AI_MANDATORY: ${CHANNEL_SCRIPT_AI_MANDATORY:-true}
      CHANNEL_SCRIPT_TIMEOUT_SEC: ${CHANNEL_SCRIPT_TIMEOUT_SEC:-180}
    volumes:
      - ./config:/app/config
      - ./scripts:/app/scripts
      - ./app_data:/app/app_data

  gemini_server:
    build:
      context: ./gemini_server
      dockerfile: Dockerfile
      network: host
    image: ${GEMINI_SERVER_IMAGE_TAG:-gemini-server:latest}
    restart: unless-stopped
    network_mode: host
    env_file:
      - .env
    environment:
      PROXY_TRUST_ENV_PROXY: ${PROXY_TRUST_ENV_PROXY:-false}
      HTTP_PROXY: ${GEMINI_HTTP_PROXY-}
      HTTPS_PROXY: ${GEMINI_HTTPS_PROXY-}
      ALL_PROXY: ${GEMINI_ALL_PROXY-}
      NO_PROXY: ${GEMINI_NO_PROXY-127.0.0.1,localhost}
      http_proxy: ${gemini_http_proxy-}
      https_proxy: ${gemini_https_proxy-}
      all_proxy: ${gemini_all_proxy-}
      no_proxy: ${gemini_no_proxy-127.0.0.1,localhost}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()"]
      interval: 15s
      timeout: 6s
      retries: 8
      start_period: 20s

volumes:
  mysql_data:
  redis_data:
