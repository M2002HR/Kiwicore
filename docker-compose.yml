services:
  kiwi:
    build:
      context: .
      network: host
      args:
        HTTP_PROXY: ${BUILD_HTTP_PROXY:-}
        HTTPS_PROXY: ${BUILD_HTTPS_PROXY:-}
        ALL_PROXY: ${BUILD_ALL_PROXY:-}
        NO_PROXY: ${BUILD_NO_PROXY:-}
        http_proxy: ${build_http_proxy:-}
        https_proxy: ${build_https_proxy:-}
        all_proxy: ${build_all_proxy:-}
        no_proxy: ${build_no_proxy:-}
    image: ${DOCKER_IMAGE_TAG:-kiwi-bridge:latest}
    restart: unless-stopped
    depends_on:
      gemini_server:
        condition: service_healthy
    env_file:
      - .env
    environment:
      GUARD_AI_ENDPOINT: http://gemini_server:8000/proxy/gemini
    volumes:
      - ./config:/app/config
      - ./scripts:/app/scripts
      - ./app_data:/app/app_data

  gemini_server:
    build:
      context: ./gemini_server
      dockerfile: Dockerfile
    image: ${GEMINI_SERVER_IMAGE_TAG:-gemini-server:latest}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PROXY_TRUST_ENV_PROXY: "false"
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      ALL_PROXY: ""
      http_proxy: ""
      https_proxy: ""
      all_proxy: ""
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()"]
      interval: 15s
      timeout: 6s
      retries: 8
      start_period: 20s
    ports:
      - "${GEMINI_SERVER_PORT:-18000}:8000"
